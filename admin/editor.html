<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cozy Website Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f0eb;color:#2b2322;font-family:Arial,sans-serif}.wrap{width:min(1100px,94vw);margin:28px auto 70px}.top{background:#7c4354;color:white;padding:28px;border-radius:24px}.top h1{font:400 34px Georgia;margin:0 0 8px}.note,.card{background:white;border:1px solid #e7dad3;border-radius:20px;padding:22px;margin-top:18px}.note{background:#fff9df;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px}input,textarea{width:100%;padding:10px;border:1px solid #d8cac4;border-radius:10px}textarea{min-height:76px}h2,h3{font-family:Georgia;font-weight:400}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #eee;text-align:left}td input{min-width:100px}.service{border:1px solid #eaded8;border-radius:16px;padding:16px;margin:12px 0}button{border:0;border-radius:999px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:#a65d72;color:white}.dark{background:#2b2322;color:white}.actions{display:flex;gap:8px;margin-top:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{width:96vw}}</style></head><body><div class="wrap"><div class="top"><h1>Cozy Website Editor</h1><p>Sửa booking link, giá, dịch vụ và text rồi tải content.js mới.</p></div><div class="note"><b>Hình ảnh/video:</b> chỉ cần replace file cùng tên trong <code>assets/images</code> hoặc <code>assets/video</code>. Không cần sửa HTML.</div><div class="grid"><div class="card"><h2>Thông tin tiệm</h2><label>Booking URL</label><input id="booking"><label>Phone</label><input id="phone"><label>Instagram URL</label><input id="ig"></div><div class="card"><h2>Hero</h2><label>Headline</label><textarea id="heroTitle"></textarea><label>Mô tả</label><textarea id="heroText"></textarea></div></div><div class="card"><h2>Dịch vụ & giá</h2><div id="services"></div></div><div class="actions"><button class="primary" id="download">Download content.js</button><button class="dark" id="copy">Copy content.js</button></div></div><script src="../assets/js/content.js"></script><script>let d=JSON.parse(JSON.stringify(window.COZY));const q=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function render(){q('booking').value=d.business.bookingUrl||'';q('phone').value=d.business.phone||'';q('ig').value=d.business.instagramUrl||'';q('heroTitle').value=d.hero.title||'';q('heroText').value=d.hero.text||'';q('services').innerHTML=d.services.map((s,si)=>`<div class="service"><h3>${e(s.name)}</h3><table><thead><tr><th>Item</th><th>Duration</th><th>Price</th></tr></thead><tbody>${s.items.map((i,ii)=>`<tr><td><input data-s="${si}" data-i="${ii}" data-f="name" value="${e(i.name)}"></td><td><input data-s="${si}" data-i="${ii}" data-f="duration" value="${e(i.duration)}"></td><td><input data-s="${si}" data-i="${ii}" data-f="price" value="${e(i.price)}"></td></tr>`).join('')}</tbody></table></div>`).join('')}function sync(){d.business.bookingUrl=q('booking').value;d.business.phone=q('phone').value;d.business.instagramUrl=q('ig').value;d.hero.title=q('heroTitle').value;d.hero.text=q('heroText').value;document.querySelectorAll('[data-s]').forEach(x=>d.services[+x.dataset.s].items[+x.dataset.i][x.dataset.f]=x.value)}function txt(){sync();return 'window.COZY = '+JSON.stringify(d,null,2)+';\n'}q('download').onclick=()=>{let b=new Blob([txt()],{type:'text/javascript'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='content.js';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};q('copy').onclick=async()=>{await navigator.clipboard.writeText(txt());alert('Copied')};render();</script></body></html>
